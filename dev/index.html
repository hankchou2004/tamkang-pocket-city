<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>淡江校園 · 開發</title>
<link rel="icon" href="../app/icon.svg" type="image/svg+xml">
<style>
/* Development page for the desktop: the phone app in the middle, at a real phone's size; panels for development tools on
   both sides (their contents are still to be decided). The app runs in an iframe, so it behaves exactly as on a phone. */
:root{--paper:#f6f3e9;--panel:#fffcf3;--ink:#263c35;--muted:#626c60;--rule:#cfcfc0;--green:#2f4f43;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:"Helvetica Neue",Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:14px/1.45 var(--sans);display:grid;grid-template-columns:minmax(260px,1fr) auto minmax(260px,1fr);gap:20px;padding:20px;overflow:hidden;
  background-image:radial-gradient(#cbd0bc 0.6px,transparent .9px);background-size:18px 18px}
.side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;box-shadow:0 3px 0 #7b80661a}
.card h2{margin:0 0 6px;font:600 10px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card p{margin:0;color:var(--muted);font-size:13px}
.empty{flex:1;border-style:dashed;background:#fffcf380;display:grid;place-items:center;text-align:center;min-height:160px}
.center{display:flex;flex-direction:column;align-items:center;gap:12px;min-height:0}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.bar select,.bar button,.bar a{font:600 12px var(--sans);color:var(--ink);background:var(--panel);border:1px solid #c7cbbd;border-radius:7px;padding:6px 10px;cursor:pointer;text-decoration:none}
.bar button:hover,.bar a:hover,.bar select:hover{background:#ececdf}
.bar .size{font:11px var(--mono);color:var(--muted)}
.holder{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:flex-start}
.phone{position:relative;border:10px solid #1f2a26;border-radius:44px;background:#1f2a26;box-shadow:0 12px 40px #3b45302e;transform-origin:top center;flex:none}
.phone iframe{display:block;border:0;border-radius:34px;background:var(--paper)}
@media(max-width:1000px){body{grid-template-columns:1fr;overflow:auto;height:auto}.side{overflow:visible}}
</style>
</head>
<body>
<aside class="side" aria-label="左側開發面板">
  <section class="card"><h2>開發頁</h2><p>中間是手機 app 的實際畫面，用滑鼠操作：左鍵拖曳移動、滾輪縮放、右鍵拖曳旋轉，點建築會拉近。</p></section>
  <section class="card empty"><p>左側面板<br>內容待定</p></section>
</aside>

<main class="center">
  <div class="bar">
    <select id="page" aria-label="地圖版本"><option value="../app/index.html">three.js 版</option><option value="../proto/maplibre.html">MapLibre 原型</option></select>
    <select id="device" aria-label="手機尺寸"></select>
    <span class="size" id="size"></span>
    <button id="reload" type="button">重新載入</button>
    <a id="open" target="_blank" rel="noopener">新分頁開啟</a>
  </div>
  <div class="holder" id="holder">
    <div class="phone" id="phone"><iframe id="app" title="手機 app 預覽" allow="geolocation"></iframe></div>
  </div>
</main>

<aside class="side" aria-label="右側開發面板">
  <section class="card empty"><p>右側面板<br>內容待定</p></section>
</aside>

<script>
const DEVICES = [['iPhone 15 / 14', 393, 852], ['iPhone SE', 375, 667], ['iPhone 15 Pro Max', 430, 932], ['Galaxy A54', 384, 854], ['Pixel 8', 412, 915], ['Galaxy S23', 360, 780]];
const $ = id => document.getElementById(id), sel = $('device'), frame = $('app'), phone = $('phone'), page = $('page');
// which map runs in the phone: the app (three.js) or the MapLibre prototype; ?at= and ?wx= (fixed time and weather) pass through
try { page.value = localStorage.getItem('tku-dev-page') || page.value; } catch (_) {}
let src = page.value + location.search;
page.onchange = () => { try { localStorage.setItem('tku-dev-page', page.value); } catch (_) {} src = page.value + location.search; frame.src = src; $('open').href = src; };
sel.innerHTML = DEVICES.map((d, i) => `<option value="${i}">${d[0]}</option>`).join('');
try { sel.value = localStorage.getItem('tku-dev-device') || '0'; } catch (_) {}
function fit() {
  const [, w, h] = DEVICES[+sel.value] || DEVICES[0];
  frame.style.width = w + 'px'; frame.style.height = h + 'px';
  const room = $('holder').clientHeight, k = Math.min(1, room / (h + 20));
  phone.style.transform = `scale(${k})`; phone.style.marginBottom = -(1 - k) * (h + 20) + 'px';
  $('size').textContent = `${w} × ${h}` + (k < 1 ? ` · 顯示 ${Math.round(k * 100)}%` : '');
}
sel.onchange = () => { try { localStorage.setItem('tku-dev-device', sel.value); } catch (_) {} fit(); };
$('reload').onclick = () => { frame.src = src; };
$('open').href = src;
addEventListener('resize', fit);
frame.src = src; fit();
</script>
</body>
</html>
