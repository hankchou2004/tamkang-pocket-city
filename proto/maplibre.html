<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>淡江校園 · MapLibre 原型</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
html,body{margin:0;height:100%;background:#f6f3e9;overflow:hidden;font:14px/1.4 "Helvetica Neue",Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#263c35}
#map{position:fixed;inset:0}
.bar{position:fixed;z-index:2;left:12px;right:64px;top:calc(env(safe-area-inset-top) + 12px);pointer-events:none}
.bar>div{display:inline-block;max-width:100%;padding:8px 12px 7px;border:1px solid #c9cdbf;border-radius:12px;background:#fffcf2ee;box-shadow:0 3px 0 #7b80661a}
.bar b{display:block;font:700 17px/1.15 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.bar small{display:block;margin-top:2px;font-size:11px;color:#5e6a5c}
#home{position:fixed;z-index:2;right:12px;bottom:calc(env(safe-area-inset-bottom) + 34px);width:48px;height:48px;border-radius:50%;border:1px solid #c1c7b8;background:#fffcf2;box-shadow:0 3px 0 #7b80661a,0 3px 10px #4d543624;display:grid;place-items:center;color:#263c35;cursor:pointer}
#home svg{width:22px;height:22px}
.haze{position:fixed;inset:0;z-index:1;pointer-events:none;background:rgba(224,207,176,.38);mix-blend-mode:multiply;opacity:0;transition:opacity 2s}
.loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;font:12px ui-monospace,Menlo,Consolas,monospace;color:#626c60;background:#fffcf2cc;padding:4px 10px;border-radius:6px;pointer-events:none}
.maplibregl-ctrl-top-right{top:calc(env(safe-area-inset-top) + 4px)}
.entry-pin{position:relative;margin-bottom:10px;padding:5px 10px;border-radius:999px;background:#2f4f43;color:#fff;font:600 12px/1 "Noto Sans TC","Microsoft JhengHei",sans-serif;white-space:nowrap;box-shadow:0 3px 10px #1f2a2640;pointer-events:none}
.entry-pin::after{content:'';position:absolute;left:50%;top:100%;margin-left:-6px;border:6px solid transparent;border-top-color:#2f4f43}
</style>
</head>
<body>
<div id="map"></div>
<div class="haze" id="haze"></div>
<div class="bar"><div><b>淡江大學</b><small id="wx">淡水</small></div></div>
<div class="loading" id="loading" role="status">正在搭建校園…</div>
<button id="home" type="button" title="回到全校" aria-label="回到全校"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><circle cx="12" cy="12" r="2.2"/></svg></button>
<!--BLOCKS-->
</body>
</html>
